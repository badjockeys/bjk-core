name: Generate API client (temporary)

on:
  push:
    branches: ['tmp/gen-core-api-2']

permissions:
  contents: write
  packages: read

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway passwords for the CI-only containers below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  AWS_ACCESS_KEY_ID: ci-s3
  AWS_SECRET_ACCESS_KEY: ci-s3-secret
  AWS_DEFAULT_REGION: us-east-1
  # The same settings developers keep in user secrets (see user-secrets.template.json).
  ConnectionStrings__BadJockeysDatabase: Server=localhost,1433;Database=badjockeys;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  Authentication__Authority: http://localhost:5999   # pipelines/scripts/fake-issuer.py, standing in for bjk-identity-server
  Authentication__RequireHttpsMetadata: "false"
  Cors__AllowedOrigins__0: http://localhost:3000
  # The queues are tables in the messaging schema of the same database. Short waits keep the smoke test quick.
  Queues__PollingInterval: "00:00:00.250"
  Queues__RetryDelay: "00:00:01"
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA   # Cloudflare's public "always passes" test key
  # Adobe's S3Mock stands in for Cloudflare R2: both speak the S3 API.
  Media__Storage__ServiceUrl: http://localhost:9090
  Media__Storage__AccessKeyId: ci-s3
  Media__Storage__SecretAccessKey: ci-s3-secret
  S3_ENDPOINT: http://localhost:9090
  Media__Storage__OriginalsBucket: bjk-ci-originals
  Media__Storage__PublicBucket: bjk-ci-public
  Media__Storage__PublicBaseUrl: http://localhost:9090/bjk-ci-public/
  # The local Elastic containers (docker-compose.yml) read these from a developer's .env.
  BJK_SQL_PASSWORD: Ci-Passw0rd-2026
  BJK_ELASTIC_PASSWORD: CiElastic2026x
  BJK_KIBANA_SYSTEM_PASSWORD: CiKibana2026x
  BJK_KIBANA_ENCRYPTION_KEY: CiKibanaEncryptionKey2026abcdefghijklmn

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore src/BJK.Core.Api
      - run: dotnet build src/BJK.Core.Api --configuration Release --no-restore -p:GenerateApiClient=true
      - name: Push the generated client to tmp/gen-core-api-2-output
        run: |
          cp src/web/src/lib/generated/api.ts /tmp/api.ts
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan out && git rm -rq --cached . && cp /tmp/api.ts api.ts
          git add api.ts && git commit -qm "Generated API client" && git push -f origin out:tmp/gen-core-api-2-output
