name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read   # BJK.Modules.* from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway passwords for the CI-only containers below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  RABBITMQ_USER: bjk
  RABBITMQ_PASSWORD: ci-rabbit-2026
  AWS_ACCESS_KEY_ID: ci-minio
  AWS_SECRET_ACCESS_KEY: ci-minio-secret
  AWS_DEFAULT_REGION: us-east-1
  # The same settings developers keep in user secrets (see user-secrets.template.json).
  ConnectionStrings__AppDatabase: Server=localhost,1433;Database=badjockeys;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  Authentication__Authority: http://localhost:5999   # pipelines/scripts/fake-issuer.py, standing in for bjk-identity-server
  Authentication__RequireHttpsMetadata: "false"
  Cors__AllowedOrigins__0: http://localhost:3000
  Messaging__ConnectionUri: amqp://bjk:ci-rabbit-2026@localhost:5672
  # MinIO stands in for Cloudflare R2: both speak the S3 API.
  Media__Storage__ServiceUrl: http://localhost:9000
  Media__Storage__AccessKeyId: ci-minio
  Media__Storage__SecretAccessKey: ci-minio-secret
  Media__Storage__OriginalsBucket: bjk-ci-originals
  Media__Storage__PublicBucket: bjk-ci-public
  Media__Storage__PublicBaseUrl: http://localhost:9000/bjk-ci-public/

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: bjk
          RABBITMQ_DEFAULT_PASS: ci-rabbit-2026
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          if ! dotnet restore BJK.Core.slnx 2>&1 | tee restore.log; then
            grep -E "error" restore.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: dotnet build BJK.Core.slnx --configuration Release --no-restore

      - name: Build the container image
        run: docker build --file src/BJK.Core.Api/Dockerfile --secret id=nuget,env=NuGetPackageSourceCredentials_badjockeys --tag bjk-core-api:ci .

      # Service containers can't take a command, so MinIO starts here.
      - name: Start MinIO and create the buckets
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && break; sleep 1; done
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket bjk-ci-originals
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket bjk-ci-public

      - name: Start the stand-in token issuer
        run: |
          pip install --quiet cryptography
          nohup python3 pipelines/scripts/fake-issuer.py 5999 > issuer.log 2>&1 &
          for _ in $(seq 1 15); do curl -fs http://localhost:5999/.well-known/openid-configuration && break; sleep 1; done

      - name: End-to-end smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5100
          SQL_CONTAINER: ${{ job.services.sql.id }}
          Logging__Console__FormatterName: simple
          Logging__Console__FormatterOptions__SingleLine: "true"
          Logging__Console__FormatterOptions__ColorBehavior: Disabled
        run: bash pipelines/scripts/smoke-test.sh
