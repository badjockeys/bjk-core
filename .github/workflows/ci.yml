name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read   # BJK.Modules.* from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway passwords for the CI-only containers below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  AWS_ACCESS_KEY_ID: ci-s3
  AWS_SECRET_ACCESS_KEY: ci-s3-secret
  AWS_DEFAULT_REGION: us-east-1
  # The same settings developers keep in user secrets (see user-secrets.template.json).
  ConnectionStrings__BadJockeysDatabase: Server=localhost,1433;Database=badjockeys;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  Authentication__Authority: http://localhost:5999   # pipelines/scripts/fake-issuer.py, standing in for bjk-identity-server
  Authentication__RequireHttpsMetadata: "false"
  Cors__AllowedOrigins__0: http://localhost:3000
  # The queues are tables in the messaging schema of the same database. Short waits keep the smoke test quick.
  Queues__PollingInterval: "00:00:00.250"
  Queues__RetryDelay: "00:00:01"
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA   # Cloudflare's public "always passes" test key
  # Adobe's S3Mock stands in for Cloudflare R2: both speak the S3 API.
  Media__Storage__ServiceUrl: http://localhost:9090
  Media__Storage__AccessKeyId: ci-s3
  Media__Storage__SecretAccessKey: ci-s3-secret
  S3_ENDPOINT: http://localhost:9090
  Media__Storage__OriginalsBucket: bjk-ci-originals
  Media__Storage__PublicBucket: bjk-ci-public
  Media__Storage__PublicBaseUrl: http://localhost:9090/bjk-ci-public/
  # The local Elastic containers (docker-compose.yml) read these from a developer's .env.
  BJK_SQL_PASSWORD: Ci-Passw0rd-2026
  BJK_ELASTIC_PASSWORD: CiElastic2026x
  BJK_KIBANA_SYSTEM_PASSWORD: CiKibana2026x
  BJK_KIBANA_ENCRYPTION_KEY: CiKibanaEncryptionKey2026abcdefghijklmn

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          if ! dotnet restore BJK.Core.slnx 2>&1 | tee restore.log; then
            grep -E "error" restore.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      # Also regenerates the web app's API client from the API (src/BJK.Core.Api/nswag.json).
      - name: Build
        run: dotnet build BJK.Core.slnx --configuration Release --no-restore -p:GenerateApiClient=true

      - name: API client is up to date
        run: |
          if ! git diff --quiet -- src/web/src/lib/generated; then
            git diff --stat -- src/web/src/lib/generated
            echo "::error title=API client out of date::src/web/src/lib/generated/api.ts doesn't match the API. Build src/BJK.Core.Api in Debug (or with -p:GenerateApiClient=true) and commit the regenerated file."
            exit 1
          fi

      - name: Build the container images
        run: |
          docker build --file src/BJK.Core.Api/Dockerfile --secret id=nuget,env=NuGetPackageSourceCredentials_badjockeys --tag bjk-core-api:ci .
          docker build --file src/BJK.Core.MediaWorker/Dockerfile --secret id=nuget,env=NuGetPackageSourceCredentials_badjockeys --tag bjk-core-media-worker:ci .
          docker run --rm --entrypoint ffmpeg bjk-core-media-worker:ci -hide_banner -encoders | grep -E 'libx264|libwebp'

      # The smoke test runs the worker on the runner, so it needs ffmpeg here too (exiftool checks GPS is stripped).
      # apt on the runners sometimes hangs for good (23 Oct 2026), so after 4 minutes it gives up and uses static
      # builds from GitHub instead: BtbN's ffmpeg (with libx264 and libwebp) and ExifTool's own repository.
      - name: Install ffmpeg and exiftool
        timeout-minutes: 10
        run: |
          apt_install() {
            sudo apt-get -o DPkg::Lock::Timeout=60 update -q &&
              sudo apt-get -o DPkg::Lock::Timeout=60 install -y -q --no-install-recommends ffmpeg libimage-exiftool-perl
          }
          export -f apt_install
          if timeout 240 bash -c apt_install; then
            exit 0
          fi
          echo "::warning::apt didn't install ffmpeg and exiftool within 4 minutes; using static builds instead."
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$tools"
          curl -fsSL --retry 3 https://github.com/exiftool/exiftool/archive/refs/heads/master.tar.gz | tar -xz -C "$tools"
          echo "$tools/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          echo "$tools/exiftool-master" >> "$GITHUB_PATH"
          "$tools/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -hide_banner -encoders | grep -E 'libx264|libwebp'
          "$tools/exiftool-master/exiftool" -ver

      # Started here rather than as a service container, so a pull failure can fall back to another tag.
      - name: Start S3Mock and create the buckets
        run: |
          started=""
          for image in adobe/s3mock:3.12.0 adobe/s3mock:latest; do
            if out=$(docker run -d --name s3 -p 9090:9090 "$image" 2>&1); then started=$image; break; fi
            echo "$out" | tail -3 | sed "s|^|::warning title=S3Mock $image::|"
            docker rm -f s3 > /dev/null 2>&1 || true
          done
          [ -n "$started" ] || { echo "::error::Couldn't start S3Mock."; exit 1; }
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:9090/ && break; sleep 1; done
          aws --endpoint-url http://localhost:9090 s3api create-bucket --bucket bjk-ci-originals
          aws --endpoint-url http://localhost:9090 s3api create-bucket --bucket bjk-ci-public
          echo "Started $started"

      # The face and number plate models the worker blurs with, and the CLIP content model (the worker image
      # downloads them the same way).
      - name: Download the blurring and content models
        run: sh pipelines/scripts/download-redaction-models.sh "$RUNNER_TEMP/models"

      - name: Start the stand-in token issuer
        run: |
          pip install --quiet cryptography
          nohup python3 pipelines/scripts/fake-issuer.py 5999 > issuer.log 2>&1 &
          for _ in $(seq 1 15); do curl -fs http://localhost:5999/.well-known/openid-configuration && break; sleep 1; done

      # Elasticsearch, Kibana and Elastic's OpenTelemetry collector from docker-compose.yml, as on a developer's
      # machine; the smoke test's apps send their logs, traces and metrics to it.
      - name: Start the logs and traces containers
        run: bash pipelines/scripts/elastic-check.sh start

      - name: End-to-end smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5100
          SQL_CONTAINER: ${{ job.services.sql.id }}
          Media__Redaction__FaceModelPath: ${{ runner.temp }}/models/face_detection_yunet_2026may.onnx
          Media__Redaction__PlateModelPath: ${{ runner.temp }}/models/license_plate_detection_lpd_yunet_2023mar.onnx
          Media__Redaction__PersonModelPath: ${{ runner.temp }}/models/object_detection_yolox_2022nov.onnx
          Media__SensitiveDetection__ModelPath: ${{ runner.temp }}/models/clip-vit-b32-vision-quantized.onnx
          Logging__Console__FormatterName: simple
          Logging__Console__FormatterOptions__SingleLine: "true"
          Logging__Console__FormatterOptions__ColorBehavior: Disabled
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_BSP_SCHEDULE_DELAY: "1000"
          OTEL_BLRP_SCHEDULE_DELAY: "1000"
        run: bash pipelines/scripts/smoke-test.sh

      # The smoke test's logs and traces reached Elasticsearch, and Kibana is up.
      - name: Logs and traces
        run: bash pipelines/scripts/elastic-check.sh verify

      # The reports: the reporting views and read-only login against the database the smoke test left behind.
      - name: Reports
        env:
          SQL_CONTAINER: ${{ job.services.sql.id }}
        run: bash pipelines/scripts/reporting-check.sh

      # The setup's example data (scripts/sql/example-data) against the same database, so a schema change that
      # breaks it fails here.
      - name: Example data
        env:
          SQL_CONTAINER: ${{ job.services.sql.id }}
        run: bash pipelines/scripts/example-data-check.sh

      # The API reference NSwag generated from this build's controllers, to download or import into Postman.
      - name: Upload the OpenAPI document
        if: ${{ !cancelled() && hashFiles('openapi.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: ignore

  # The web app (src/web): lint, types, unit tests, build, container image, then end-to-end tests in a browser against
  # e2e/mock-server.mjs, which stands in for the identity server and the API. Each check runs even if an earlier one
  # failed, so one run shows every problem; failures are copied into annotations (pipelines/scripts/ci-step.sh).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    env:
      CI_STEP: ${{ github.workspace }}/pipelines/scripts/ci-step.sh
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        id: install
        run: bash "$CI_STEP" "npm ci" npm ci --no-audit --no-fund

      - name: Licences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$CI_STEP" "Licences" npm run licences

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$CI_STEP" "Lint" npm run lint

      - name: Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$CI_STEP" "Formatting" npm run format:check

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$CI_STEP" "Type check" npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bash "$CI_STEP" "Unit tests" npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
          node -e 'const r=require("./vitest-results.json"); console.log(`::notice title=Web unit tests::${r.numPassedTests} of ${r.numTotalTests} passed in ${r.numTotalTestSuites} suites`)'

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$CI_STEP" "Build" npm run build

      - name: Container image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash "$CI_STEP" "Docker build" docker build --tag bjk-core-web:ci .
          docker run -d --name web -p 3100:3000 \
            -e APP_URL=http://localhost:3100 -e API_BASE_URL=http://localhost:4010 \
            -e IDSRV_AUTHORITY=http://localhost:4010 -e IDSRV_CLIENT_SECRET=ci -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            bjk-core-web:ci
          for _ in $(seq 1 30); do curl -fs http://localhost:3100/healthz && break; sleep 1; done
          curl -fs http://localhost:3100/healthz || { docker logs web; echo "::error title=Container::The web container didn't answer /healthz"; exit 1; }
          test "$(docker exec web id -u)" != "0" || { echo "::error title=Container::The web container runs as root"; exit 1; }
          docker rm -f web

      - name: Install the Playwright browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CI_STEP_LINES: "250"
        run: |
          bash "$CI_STEP" "End-to-end tests" npm run e2e
          node -e 'const s=require("./test-results/results.json").stats; console.log(`::notice title=Web end-to-end tests::${s.expected} passed, ${s.unexpected} failed, ${s.flaky} flaky, ${s.skipped} skipped`)'

