# Temporary: regenerates the web app's API client for this branch. Removed before review.
name: tmp-api-client
on:
  push:
    branches: [feature/ui-step4-trends]
permissions:
  contents: write
  packages: read
env:
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  ConnectionStrings__AppDatabase: Server=localhost,1433;Database=badjockeys;User Id=sa;Password=x;TrustServerCertificate=True
  Authentication__Authority: http://localhost:5999
  Cors__AllowedOrigins__0: http://localhost:3000
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA
  Media__Storage__ServiceUrl: http://localhost:9090
  Media__Storage__AccessKeyId: ci-s3
  Media__Storage__SecretAccessKey: ci-s3-secret
  Media__Storage__OriginalsBucket: bjk-ci-originals
  Media__Storage__PublicBucket: bjk-ci-public
  Media__Storage__PublicBaseUrl: http://localhost:9090/bjk-ci-public/
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore BJK.Core.slnx
      - run: dotnet build src/BJK.Core.Api --configuration Release --no-restore -p:GenerateApiClient=true 2>&1 | tee build.log
        continue-on-error: true
      - name: Push the generated client
        if: ${{ always() }}
        run: |
          git add -f build.log
          git add -A src/web/src/lib/generated || true
          git -c user.name=ci -c user.email=ci@example.com commit -m "Generated API client"
          git push origin HEAD:refs/heads/tmp/ui-step4-client --force
