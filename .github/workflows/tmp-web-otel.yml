# Temporary: adds @vercel/otel to the web app and commits the lock file. Removed before review.
name: tmp-web-otel
on:
  push:
    branches: [feature/observability]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm install --save-exact --no-audit --no-fund @vercel/otel@2.1.3 @opentelemetry/api@1.9.1 2>&1 | tee ../../npm.log
      - run: npm ls @vercel/otel @opentelemetry/api @opentelemetry/sdk-trace-base 2>&1 | tee -a ../../npm.log || true
      - run: |
          cd ../..
          git add -f npm.log src/web/package.json src/web/package-lock.json
          git -c user.name=ci -c user.email=ci@example.com commit -m "web otel deps"
          git push origin HEAD:refs/heads/tmp/web-otel --force
