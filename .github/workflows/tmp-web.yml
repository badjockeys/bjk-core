# Temporary: formats, lints, type-checks and unit-tests the web app on this branch, pushing any formatting fixes and
# the log to a tmp branch. Removed before review.
name: tmp-web
on:
  push:
    branches: [feature/engagement]
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Check
        continue-on-error: true
        run: |
          exec > >(tee web.log) 2>&1
          npm ci --no-audit --no-fund
          echo "=== prettier"; npx prettier --write . | grep -v "unchanged" | head -80
          echo "=== lint"; npx eslint . --fix --max-warnings=0 2>&1 | tail -80
          echo "=== typecheck"; npm run typecheck 2>&1 | tail -80
          echo "=== test"; npx vitest run 2>&1 | grep -vE "^\s*$" | tail -80
      - name: Push
        if: ${{ always() }}
        run: |
          git add -f web.log
          git add -A src e2e || true
          git -c user.name=ci -c user.email=ci@example.com commit -m "Formatted (tmp)"
          git push origin HEAD:refs/heads/tmp/engagement-web --force
