# The dashboards in ../../dashboards, kept in git. Changes made in Grafana's editor aren't saved here: export the
# JSON (Share → Export) into the dashboards folder instead.
apiVersion: 1
providers:
  - name: Bad Jockeys
    folder: Bad Jockeys
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
