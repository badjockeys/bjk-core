# The local OpenTelemetry collector (Elastic's distribution, EDOT), run by docker-compose.yml. It receives OTLP from
# the identity server, the API, the media worker and the web app's server on ports 4317 (gRPC) and 4318 (HTTP), and
# writes to the local Elasticsearch in OpenTelemetry's own format. Based on Elastic's gateway sample for 9.5.
#
# When deployed there's no collector of ours: the apps send straight to Elastic Cloud's managed OTLP endpoint, which
# does the same work.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # Builds the service summaries (throughput, latency, errors) Kibana's service views read.
  elasticapm: {}

processors:
  batch:
    send_batch_size: 1000
    timeout: 1s
    send_batch_max_size: 1500
  batch/metrics:
    send_batch_max_size: 0 # don't split metric requests
    timeout: 1s
  elasticapm: {}

exporters:
  elasticsearch/otel:
    endpoints:
      - ${env:ELASTIC_ENDPOINT}
    user: elastic
    password: ${env:ELASTIC_PASSWORD}
    mapping:
      mode: otel

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch/metrics]
      exporters: [elasticsearch/otel]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticapm, elasticsearch/otel]
    traces:
      receivers: [otlp]
      processors: [batch, elasticapm]
      exporters: [elasticapm, elasticsearch/otel]
    metrics/aggregated-otel-metrics:
      receivers: [elasticapm]
      processors: []
      exporters: [elasticsearch/otel]
