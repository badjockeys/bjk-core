# The services Bad Jockeys needs on your machine, in one Docker group called "bad-jockeys". The apps themselves
# (identity server, API, media worker, web app) run outside Docker; see docs/local-development.md.
#
#   docker compose up -d --wait   starts them and waits until SQL Server is healthy
#   docker compose stop           stops them and keeps the data
#   docker compose down -v        removes them and ALL local data (databases, queues, uploaded files)
#
# The sa password comes from .env (git-ignored) next to this file; scripts/setup-local.mjs creates it, or copy
# .env.example to .env. You rarely need these commands: the setup, "Run Bad Jockeys" and F5 start them for you.
name: bad-jockeys

services:
  # SQL Server 2022: both databases (idsrv for the identity server, badjockeys for the API) and the message queues
  # (schema messaging of badjockeys).
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships for x86-64; on Apple Silicon Docker Desktop runs it under Rosetta.
    platform: linux/amd64
    container_name: bad-jockeys-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BJK_SQL_PASSWORD:?Set BJK_SQL_PASSWORD in bjk-core/.env - see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Adobe's S3Mock: the local stand-in for Cloudflare R2. It speaks the same S3 API, so the API and the media worker
  # don't know the difference, and it doesn't check keys or signatures, so any access key works.
  s3:
    image: adobe/s3mock:3.12.0
    container_name: bad-jockeys-s3mock
    ports:
      - "9090:9090"
    environment:
      initialBuckets: bjk-dev-originals,bjk-dev-public
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bjk-dev-originals,bjk-dev-public
      root: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      retainFilesOnExit: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3-data:/data

  # Grafana's all-in-one OpenTelemetry stack for local logs, traces and metrics: an OpenTelemetry collector, Loki
  # (logs), Tempo (traces) and Prometheus (metrics), the same parts Grafana Cloud runs. The apps send to it on
  # http://localhost:4318 (OTEL_EXPORTER_OTLP_ENDPOINT in their launchSettings.json); our Grafana below reads it. Data
  # is kept only while the container runs. Its own Grafana isn't published: use http://localhost:3300.
  lgtm:
    image: grafana/otel-lgtm:0.29.1
    container_name: bad-jockeys-otel
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  # Grafana: the reports (src/reporting). It reads only the reporting views in both databases, through the read-only
  # bjk_reporting login (scripts/sql/reporting/apply.mjs creates both). http://localhost:3300: anyone on this
  # computer can view; admin / admin to edit (edits aren't kept: change the JSON in src/reporting instead).
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: bad-jockeys-grafana
    ports:
      - "3300:3000"
    environment:
      BJK_REPORTING_SQL_SERVER: sql:1433
      BJK_REPORTING_PASSWORD: ${BJK_REPORTING_PASSWORD:-not-set-run-the-setup}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bad-jockeys.json
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./src/reporting/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/reporting/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - sql
      - lgtm
    restart: unless-stopped

volumes:
  sql-data:
  s3-data:
  grafana-data:
