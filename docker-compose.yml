# Bad Jockeys on your machine, in one Docker group called "bad-jockeys". Every service belongs to a profile, and you
# pick one (docs/local-development.md has the step-by-step guide):
#
#   source    What the apps need when you run them from source (F5 in VS Code): SQL Server, S3Mock, and
#             Elasticsearch, Kibana and the OpenTelemetry collector.
#   release   The same, plus the four apps themselves (identity server, API, media worker, web app) as the images CI
#             published to ghcr.io/badjockeys, using your own user secrets. tag=<bjk-core commit sha> picks the API,
#             media worker and web images; identity_tag=<bjk-identity-server commit sha> picks the identity server's
#             (its own repo, so its own SHAs). Either left out means latest.
#
#   docker compose --profile source up -d --wait     starts the source profile and waits until it's ready
#   docker compose --profile release up -d --wait    the released build: http://localhost:3000
#   tag=3f2a9c1 docker compose --profile release up -d --wait   a specific bjk-core build (PowerShell: $env:tag="3f2a9c1")
#   docker compose --profile release down            removes the containers, keeps the data (then F5 works again)
#   docker compose --profile "*" down -v             removes everything and ALL local data (databases, queues, files, logs)
#
# The passwords and BJK_USER_SECRETS_DIR come from .env (git-ignored) next to this file; the setup
# (scripts/setup/setup.sh or setup.ps1) creates it. You rarely need the source commands: the setup, "Run Bad Jockeys"
# and F5 start them for you.
name: bad-jockeys

services:
  # SQL Server 2022: both databases (idsrv for the identity server, badjockeys for the API) and the message queues
  # (schema messaging of badjockeys).
  sql:
    profiles: [source, release]
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships for x86-64; on Apple Silicon Docker Desktop runs it under Rosetta.
    platform: linux/amd64
    container_name: bad-jockeys-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BJK_SQL_PASSWORD:?Set BJK_SQL_PASSWORD in bjk-core/.env - see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Adobe's S3Mock: the local stand-in for Cloudflare R2. It speaks the same S3 API, so the API and the media worker
  # don't know the difference, and it doesn't check keys or signatures, so any access key works.
  s3:
    profiles: [source, release]
    image: adobe/s3mock:3.12.0
    container_name: bad-jockeys-s3mock
    ports:
      - "9090:9090"
    environment:
      initialBuckets: bjk-dev-originals,bjk-dev-public
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bjk-dev-originals,bjk-dev-public
      root: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      retainFilesOnExit: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3-data:/data

  # Logs, traces and metrics: Elasticsearch stores them, Kibana shows them (http://localhost:5601, sign in as
  # "elastic" with BJK_ELASTIC_PASSWORD from .env), and Elastic's OpenTelemetry collector (EDOT) receives them from the
  # apps on http://localhost:4318 (OTEL_EXPORTER_OTLP_ENDPOINT in their launchSettings.json and src/web/.env.local).
  # The same version as Elastic Cloud when deployed, where only the apps' OTLP address and key change. Free (basic)
  # licence; data is kept in the elastic-data volume. The setup adds the three BJK_ELASTIC_/BJK_KIBANA_ values to .env.
  elasticsearch:
    profiles: [source, release]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: bad-jockeys-elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${BJK_ELASTIC_PASSWORD:?Run the setup (node scripts/setup-local.mjs) to add BJK_ELASTIC_PASSWORD to bjk-core/.env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      xpack.ml.enabled: "false"
      # 1 GB is plenty for one developer. UseSVE=0 works around a JVM crash on some Apple Silicon Macs (JDK-8345296);
      # IgnoreUnrecognizedVMOptions makes Intel machines skip it.
      ES_JAVA_OPTS: -Xms1g -Xmx1g -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
      # Keep working on a nearly full laptop disk (the defaults stop writes at 95%).
      cluster.routing.allocation.disk.watermark.low: 1gb
      cluster.routing.allocation.disk.watermark.high: 1gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null -u \"elastic:$$ELASTIC_PASSWORD\" http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Sets the password Kibana signs in to Elasticsearch with (the built-in kibana_system user), then stops. Kibana
  # can't use the "elastic" superuser.
  kibana-setup:
    profiles: [source, release]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: bad-jockeys-kibana-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${BJK_ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${BJK_KIBANA_SYSTEM_PASSWORD:?Run the setup (node scripts/setup-local.mjs) to add BJK_KIBANA_SYSTEM_PASSWORD to bjk-core/.env}
    command: >
      bash -c '
        for _ in $$(seq 1 30); do
          curl -s -u "elastic:$$ELASTIC_PASSWORD" -X POST -H "Content-Type: application/json" -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}" http://elasticsearch:9200/_security/user/kibana_system/_password | grep -q "^{}" && exit 0;
          sleep 2;
        done;
        echo "Could not set the kibana_system password"; exit 1'
    restart: "no"

  kibana:
    profiles: [source, release]
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: bad-jockeys-kibana
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${BJK_KIBANA_SYSTEM_PASSWORD}
      # Needed for alert rules and connectors; any 32+ characters, kept the same between restarts.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${BJK_KIBANA_ENCRYPTION_KEY:?Run the setup (node scripts/setup-local.mjs) to add BJK_KIBANA_ENCRYPTION_KEY to bjk-core/.env}
      # Open on the Observability view (services, logs, traces) rather than search.
      XPACK_SPACES_DEFAULTSOLUTION: oblt
      TELEMETRY_OPTIN: "false"
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q -E 'HTTP/1.1 (200|401)'"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Elastic's distribution of the OpenTelemetry collector: takes OTLP from the apps and writes it to Elasticsearch in
  # OpenTelemetry's own format, adding the summaries Kibana's service views need (src/observability/edot-collector.yml).
  otel-collector:
    profiles: [source, release]
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.5
    container_name: bad-jockeys-otel-collector
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      ELASTIC_ENDPOINT: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${BJK_ELASTIC_PASSWORD}
    volumes:
      - ./src/observability/edot-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  # ---------- The released build (profile "release") ----------
  #
  # The four app images from GHCR, run the way F5 runs them: Development, with your user secrets (mounted read-only
  # and required: an app stops at once, naming the path, if its file is missing) and src/web/.env.local. They share
  # one network, like programs on your machine, so localhost:1433, localhost:9090 and the rest mean the same as for
  # F5 and your settings work unchanged. The only differences, set below: inside Docker the apps serve plain HTTP
  # (as behind Container Apps' ingress), so the identity server and the API are http://localhost:5001 and
  # http://localhost:5101, and each image uses its own ffmpeg and models.

  # Holds the shared network: it publishes the apps' ports to your machine, and forwards localhost:1433 (SQL Server),
  # localhost:9090 (S3Mock) and localhost:4318 (the OpenTelemetry collector) to those containers.
  apps-network:
    profiles: [release]
    image: alpine:3.22
    container_name: bad-jockeys-apps-network
    depends_on:
      sql:
        condition: service_healthy
      s3:
        condition: service_started
    command: >
      sh -c 'apk add --no-cache --quiet socat && {
        socat TCP-LISTEN:1433,fork,reuseaddr TCP:sql:1433 &
        socat TCP-LISTEN:9090,fork,reuseaddr TCP:s3:9090 &
        socat TCP-LISTEN:4318,fork,reuseaddr TCP:otel-collector:4318 &
        wait; }'
    ports:
      - "127.0.0.1:3000:3000"   # web app
      - "127.0.0.1:5001:5001"   # identity server
      - "127.0.0.1:5101:5101"   # API
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1433 && nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 4318"]
      interval: 2s
      timeout: 2s
      retries: 60

  identity-server:
    profiles: [release]
    image: ghcr.io/badjockeys/bjk-identity-server:${identity_tag:-latest}
    pull_policy: always
    container_name: bad-jockeys-identity-server
    network_mode: service:apps-network
    depends_on:
      apps-network:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      BJK_REQUIRE_USER_SECRETS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Plain HTTP inside Docker (your user secrets say https://localhost:5001, for F5).
      Email__PublicOrigin: http://localhost:5001
      Email__PasswordResetUrl: http://localhost:5001/Account/ResetPassword
    volumes:
      - type: bind
        source: ${BJK_USER_SECRETS_DIR:-./.local/BJK_USER_SECRETS_DIR-is-not-set}/bjk-identity-server
        target: /home/app/.microsoft/usersecrets/bjk-identity-server
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5001 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 36

  api:
    profiles: [release]
    image: ghcr.io/badjockeys/bjk-core-api:${tag:-latest}
    pull_policy: always
    container_name: bad-jockeys-api
    network_mode: service:apps-network
    depends_on:
      apps-network:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5101
      BJK_REQUIRE_USER_SECRETS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # The identity server is plain HTTP inside Docker (your user secrets say https://localhost:5001, for F5).
      Authentication__Authority: http://localhost:5001
      Authentication__RequireHttpsMetadata: "false"
    volumes:
      - type: bind
        source: ${BJK_USER_SECRETS_DIR:-./.local/BJK_USER_SECRETS_DIR-is-not-set}/bjk-core-api
        target: /home/app/.microsoft/usersecrets/bjk-core-api
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5101 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 36

  # Shares the API's user secrets, as with F5. The API creates the database, so the worker starts once it's healthy.
  media-worker:
    profiles: [release]
    image: ghcr.io/badjockeys/bjk-core-media-worker:${tag:-latest}
    pull_policy: always
    container_name: bad-jockeys-media-worker
    network_mode: service:apps-network
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      BJK_REQUIRE_USER_SECRETS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # The image's own ffmpeg (your user secrets may point at one on your machine). Its models are set by the image.
      Media__Processing__FfmpegPath: ffmpeg
      Media__Processing__FfprobePath: ffprobe
    volumes:
      - type: bind
        source: ${BJK_USER_SECRETS_DIR:-./.local/BJK_USER_SECRETS_DIR-is-not-set}/bjk-core-api
        target: /home/app/.microsoft/usersecrets/bjk-core-api
        read_only: true
        bind:
          create_host_path: false

  # Reads src/web/.env.local like npm run dev. The image's own health check (/healthz) tells --wait when it's ready.
  web:
    profiles: [release]
    image: ghcr.io/badjockeys/bjk-core-web:${tag:-latest}
    pull_policy: always
    container_name: bad-jockeys-web
    network_mode: service:apps-network
    depends_on:
      identity-server:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - path: src/web/.env.local
        required: false
    environment:
      # Plain HTTP inside Docker (.env.local says https, for F5), and no certificate to trust.
      API_BASE_URL: http://localhost:5101
      IDSRV_AUTHORITY: http://localhost:5001
      IDSRV_ALLOW_HTTP: "true"
      NODE_EXTRA_CA_CERTS: ""

volumes:
  sql-data:
  s3-data:
  elastic-data:
  kibana-data:
